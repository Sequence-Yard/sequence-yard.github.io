<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sequence Yard</title>
<style>
  :root { --bg:#f6f5f1; --card:#fff; --text:#2c2c2a; --sub:#5f5e5a; --line:#e2e0d8; --accent:#1d9e75; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161616; --card:#1f1f1e; --text:#e8e7e2; --sub:#a3a29c; --line:#333; --accent:#5dcaa5; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font: 16px/1.7 "Roboto","Noto Sans JP","Hiragino Sans",sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  a { color: var(--accent); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px 24px; margin:16px 0; }
  .app { display:flex; gap:16px; align-items:center; }
  .app img { width:72px; height:72px; border-radius:16px; flex:none; }
  h1 { margin:0 0 4px; font-size:1.7em; letter-spacing:1px; }
  h2 { margin:0; font-size:1.25em; }
  p { margin:.4em 0; }
  .sub { color:var(--sub); font-size:.92em; }
  ul.links { padding-left:1.2em; margin:.6em 0 0; }
</style>
</head>
<body>
<main>
<h1>Sequence Yard</h1>
<p class="sub">Android の音楽アプリを作っています。 / Music apps for Android.</p>

<div class="card app">
  <img src="dbr1/icon.png" alt="">
  <div>
    <h2><a href="dbr1/">DBR-1</a></h2>
    <p>サンプリング・リズムマシン / Sampling rhythm machine</p>
  </div>
</div>
</main>
</body>
</html>
